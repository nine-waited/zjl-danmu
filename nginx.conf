server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /admin {
        try_files /index.html =404;
    }
    location = /admin/ {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
