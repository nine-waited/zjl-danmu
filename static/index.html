<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互动弹幕大屏系统</title>
    <script>
        // 同一份页面既挂在根路径，也挂在 nginx 的 /danmu/ 下
        window.BASE = location.pathname.startsWith('/danmu') ? '/danmu' : '';
        document.write('<script src="' + BASE + '/assets/vendor/tailwind.js"><\/script>');
        document.write('<link rel="stylesheet" href="' + BASE + '/assets/vendor/fontawesome/css/all.min.css">');
    </script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* 弹幕动画 */
        .bullet-item {
            position: absolute;
            white-space: nowrap;
            will-change: transform;
            pointer-events: auto;
        }

        /* 只在发送者自己的浏览器上出现：马卡龙蓝框 + 魔法光效 */
        .bullet-item.danmu-mine {
            border-width: 3px;
            border-color: #9adcf6;
            box-shadow:
                0 0 8px rgba(154, 220, 246, 0.95),
                0 0 18px rgba(125, 211, 252, 0.75),
                0 0 32px rgba(196, 181, 253, 0.55);
            animation: mineMagicGlow 1.8s ease-in-out infinite;
        }
        .danmu-mine::before,
        .danmu-mine::after {
            content: '';
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            pointer-events: none;
            background: #fff;
            box-shadow: 0 0 8px #fff, 0 0 14px #bae6fd;
            animation: mineSpark 1.35s ease-in-out infinite;
        }
        .danmu-mine::before {
            top: -5px;
            left: 18px;
        }
        .danmu-mine::after {
            right: 14px;
            bottom: -4px;
            animation-delay: 0.65s;
            box-shadow: 0 0 8px #fff, 0 0 14px #ddd6fe;
        }
        @keyframes mineMagicGlow {
            0%, 100% {
                border-color: #8fd4f4;
                box-shadow:
                    0 0 8px rgba(143, 212, 244, 0.85),
                    0 0 16px rgba(125, 211, 252, 0.45),
                    0 0 28px rgba(221, 214, 254, 0.35);
            }
            50% {
                border-color: #e7f8ff;
                box-shadow:
                    0 0 14px rgba(231, 248, 255, 1),
                    0 0 28px rgba(125, 211, 252, 0.9),
                    0 0 46px rgba(196, 181, 253, 0.75);
            }
        }
        @keyframes mineSpark {
            0%, 100% { opacity: 0.25; transform: scale(0.65); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .danmu-mine-tag {
            font-size: 10px;
            line-height: 1;
            font-weight: 700;
            color: #0f3a52;
            background: linear-gradient(180deg, #e7f8ff, #8fd4f4);
            box-shadow: 0 0 8px rgba(143, 212, 244, 0.9);
            border-radius: 999px;
            padding: 2px 5px;
            flex-shrink: 0;
        }


        @keyframes DanmuFly {
            from {
                transform: translateX(100vw);
            }
            to {
                transform: translateX(-100%);
            }
        }

        /* 清屏：弹幕本体消散 */
        .danmu-dissipating {
            animation: none !important;
            pointer-events: none !important;
            transition: opacity 1.1s ease, transform 1.1s ease, filter 1.1s ease;
            opacity: 0 !important;
            filter: blur(5px);
            /* 基于定格后的 fixed 位置再缩小，不再依赖 DanmuFly 的 translateX */
            transform: scale(0.55) !important;
        }

        /* 清屏：粒子 */
        .danmu-particle {
            position: fixed;
            width: 7px;
            height: 7px;
            margin: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 70;
            box-shadow: 0 0 8px currentColor;
            animation: danmuParticleOut 1.6s cubic-bezier(0.12, 0.7, 0.25, 1) forwards;
            will-change: transform, opacity;
        }
        @keyframes danmuParticleOut {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(0.15);
            }
        }

        /* 呼吸与脉冲效果 */
        @keyframes pulse-custom {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .animate-mickey {
            animation: pulse-custom 1.8s infinite ease-in-out;
        }
        .qr-sphere {
            box-shadow:
                inset -10px -12px 22px rgba(15, 23, 42, 0.28),
                inset 8px 10px 18px rgba(255, 255, 255, 0.45),
                0 14px 36px rgba(0, 0, 0, 0.35);
        }

        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="relative w-screen h-screen bg-slate-900 text-white overflow-hidden">

    <!-- 背景图片涂层 -->
    <div id="bgLayer" class="absolute inset-0 bg-cover bg-center brightness-75 scale-105" data-bg="%%DANMU_BG_ATTR%%"></div>
    <script>
        (function () {
            var layer = document.getElementById("bgLayer");
            if (!layer) return;
            var url = "";
            try { url = JSON.parse(layer.getAttribute("data-bg") || '""'); } catch (e) { url = ""; }
            if (!url) return;
            var base = location.pathname.indexOf("/danmu") === 0 ? "/danmu" : "";
            var full = url.charAt(0) === "/" ? base + url : url;
            layer.dataset.applied = url;
            layer.style.backgroundImage = "url('" + String(full).replace(/'/g, "") + "')";
        })();
    </script>
    <!-- 渐变蒙版，提升文字清晰度 -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60 pointer-events-none"></div>

    <!-- 顶部控制栏：logo、地域统计、删除按钮 -->
    <header id="topChrome" class="relative z-30 flex items-center gap-2 px-3 py-1 bg-black/30 backdrop-blur-md border-b border-white/10">
        <div class="flex items-center gap-1.5 shrink-0">
            <div class="w-7 h-7 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 flex items-center justify-center shadow-lg">
                <i class="fa-solid font-bold fa-paper-plane text-xs text-white"></i>
            </div>
            <h1 class="hidden sm:block text-sm font-bold tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-pink-300 via-purple-300 to-indigo-300">
                互动弹幕大屏
            </h1>
        </div>

        <div id="cityBoard" class="flex-1 min-w-0">
            <div id="cityGrid" class="grid w-full grid-flow-col grid-rows-2 grid-cols-4 gap-0.5"></div>
        </div>

        <!-- 顶部工具按钮群 -->
        <div class="flex flex-wrap items-center justify-end gap-2 shrink-0 ml-auto">
            <button id="bgBtn" class="hidden px-4 py-2 bg-white/10 hover:bg-white/20 active:scale-95 transition backdrop-blur-md rounded-full text-sm font-medium flex items-center space-x-2 border border-white/20">
                <i class="fa-solid fa-image text-pink-400"></i>
                <span>更换背景</span>
            </button>
            <button id="musicBtn" class="hidden px-4 py-2 bg-white/10 hover:bg-white/20 active:scale-95 transition backdrop-blur-md rounded-full text-sm font-medium flex items-center space-x-2 border border-white/20">
                <i class="fa-solid fa-music text-emerald-300"></i>
                <span>背景音乐</span>
            </button>
            <button id="presetBtn" class="hidden px-4 py-2 bg-white/10 hover:bg-white/20 active:scale-95 transition backdrop-blur-md rounded-full text-sm font-medium flex items-center space-x-2 border border-white/20">
                <i class="fa-solid fa-list-check text-indigo-400"></i>
                <span>预设/批量弹幕</span>
            </button>
            <label id="speedControl" class="hidden items-center gap-2 px-3 py-1.5 bg-white/10 border border-white/20 rounded-full text-sm">
                <i class="fa-solid fa-gauge-high text-amber-300"></i>
                <span class="text-xs text-slate-300">慢</span>
                <input id="speedSlider" type="range" min="0" max="100" step="1" value="50" class="w-28 md:w-40 accent-pink-500 cursor-pointer" aria-label="弹幕速度，0 最慢，50 为当前速度，100 最快">
                <span class="text-xs text-slate-300">快</span>
                <span id="speedValue" class="w-7 text-right tabular-nums text-pink-200">50</span>
            </label>
            <button id="clearVisitsBtn" class="hidden px-3 py-2 bg-amber-500/20 hover:bg-amber-500/40 text-amber-100 active:scale-95 transition rounded-full text-sm font-medium border border-amber-500/30" title="清空今日访问统计">
                <i class="fa-solid fa-chart-column mr-1"></i><span class="hidden sm:inline">清空访问</span>
            </button>
            <button id="myCityBtn" type="button" class="inline-flex items-center gap-1 px-2 py-1 bg-white/10 hover:bg-white/20 text-pink-100 active:scale-95 transition rounded-full text-[11px] font-medium border border-white/20 leading-none" title="选择所在城市" aria-label="更改所在城市">
                <i class="fa-solid fa-location-dot text-[10px] text-pink-300"></i>
                <span id="myCityLabel">选地域</span>
            </button>
            <button id="clearBtn" class="px-2.5 py-1 bg-red-500/20 hover:bg-red-500/40 text-red-200 active:scale-95 transition rounded-full text-sm font-medium border border-red-500/30 leading-none" title="清屏">
                <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
        </div>
    </header>
    <audio id="bgm" loop preload="auto" playsinline webkit-playsinline></audio>
    <button id="bgmHint" type="button" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-40 px-4 py-2 rounded-full bg-black/70 border border-white/20 text-sm font-medium shadow-lg">点击播放背景音乐</button>

    <!-- 弹幕滚屏展示区域 -->
    <main id="danmuContainer" class="absolute inset-0 z-10 pointer-events-none overflow-hidden pt-20 pb-24">
        <!-- 动态生成的弹幕会插入在这里 -->
    </main>

    <!-- 网页中间：米老鼠手形状的点击触发按钮 (未打开弹幕发射器时显示) -->
    <div id="mickeyCenterArea" class="absolute inset-0 z-20 flex flex-col items-center justify-center pointer-events-none">
        <button id="openSendModalBtn" class="pointer-events-auto group relative flex flex-col items-center focus:outline-none transition-transform hover:scale-105 active:scale-95">
            <!-- 光晕背景 -->
            <div class="absolute -inset-4 rounded-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 opacity-75 blur-lg group-hover:opacity-100 transition duration-500 animate-pulse"></div>
            
            <!-- 球形二维码（扫码打开 https://nineee.xyz/danmu/），完全填充圆形 -->
            <div class="relative w-28 h-28 md:w-40 md:h-40 rounded-full overflow-hidden border-4 border-white animate-mickey qr-sphere bg-white">
                <img id="sendGloveImg" alt="扫码访问弹幕页 https://nineee.xyz/danmu/" class="absolute inset-0 w-full h-full object-cover pointer-events-none select-none">
                <script>document.getElementById('sendGloveImg').src = BASE + '/assets/danmu-sphere-qr.png?v=3';</script>
            </div>
            
            <span class="mt-4 px-5 py-2 max-w-[18rem] text-center bg-black/60 backdrop-blur-md border border-white/20 text-white rounded-full text-sm md:text-base font-bold tracking-wide shadow-lg group-hover:bg-pink-600 transition">
                手机welink扫码发射弹幕 <i class="fa-solid fa-hand-pointer ml-1 animate-bounce"></i>
            </span>
        </button>
    </div>

    <!-- 进场选城：城市榜按自选统计，IP 仅作建议高亮 -->
    <div id="cityPickModal" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="relative w-full max-w-md mx-4 bg-slate-800/95 border border-slate-700/80 rounded-3xl p-6 md:p-8 shadow-2xl text-white transform scale-95 transition-transform duration-300">
            <h2 class="text-xl font-bold mb-2 flex items-center gap-2 text-pink-300">
                <i class="fa-solid fa-location-dot"></i>
                <span>选择你所在的城市</span>
            </h2>
            <p id="cityPickHint" class="text-sm text-slate-300 mb-5 leading-relaxed">
                用于大屏城市访问统计。运营商归属地可能不准，请按你实际所在城市选择。
            </p>
            <div id="cityPickGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
        </div>
    </div>

    <!-- 弹窗1：个人发射弹幕Modal -->
    <div id="sendModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="relative w-full max-w-lg mx-4 bg-slate-800/95 border border-slate-700/80 rounded-3xl p-6 md:p-8 shadow-2xl text-white transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto no-scrollbar">
            
            <!-- 关闭按钮 -->
            <button id="closeSendModal" class="absolute top-5 right-5 text-slate-400 hover:text-white w-9 h-9 rounded-full bg-slate-700/50 flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <h2 class="text-2xl font-bold mb-6 flex items-center space-x-2 text-pink-400">
                <i class="fa-solid fa-paper-plane"></i>
                <span>发送专属弹幕</span>
            </h2>

            <form id="danmuForm" class="space-y-5">
                <!-- 头像选择与上传 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">选择/上传头像</label>
                    <div class="flex items-center space-x-4">
                        <img id="avatarPreview" class="w-14 h-14 rounded-full object-cover border-2 border-pink-500 shadow-md" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="头像预览">
                        
                        <!-- 默认内置预设头像快速选择 -->
                        <div class="flex items-center space-x-2 overflow-x-auto pb-1 max-w-[180px]">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="preset-avatar w-9 h-9 rounded-full cursor-pointer border-2 border-transparent hover:border-pink-500 transition">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka" class="preset-avatar w-9 h-9 rounded-full cursor-pointer border-2 border-transparent hover:border-pink-500 transition">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Zoe" class="preset-avatar w-9 h-9 rounded-full cursor-pointer border-2 border-transparent hover:border-pink-500 transition">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Jack" class="preset-avatar w-9 h-9 rounded-full cursor-pointer border-2 border-transparent hover:border-pink-500 transition">
                        </div>

                        <!-- 自定义图片上传按钮 -->
                        <label class="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-medium cursor-pointer transition border border-slate-600 flex items-center space-x-1">
                            <i class="fa-solid fa-upload"></i>
                            <span>自定义</span>
                            <input type="file" id="avatarInput" accept="image/*" class="hidden">
                        </label>
                    </div>
                </div>

                <!-- 姓名输入 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2" for="userName">员工姓名 / 昵称</label>
                    <input type="text" id="userName" required placeholder="请输入您的姓名" maxlength="12"
                           class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-pink-500 transition">
                </div>

                <!-- 弹幕文字内容与Emoji -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-semibold text-slate-300" for="danmuText">弹幕内容</label>
                        <!-- Emoji 选择器开合按钮 -->
                        <button type="button" id="toggleEmojiBtn" class="text-xs text-pink-400 hover:text-pink-300 flex items-center space-x-1">
                            <i class="fa-solid fa-face-smile text-base"></i>
                            <span>快捷 Emoji</span>
                        </button>
                    </div>

                    <!-- Emoji 快选区 -->
                    <div id="emojiPicker" class="hidden mb-3 p-3 bg-slate-900/90 rounded-xl border border-slate-700 grid grid-cols-8 gap-2 text-xl max-h-32 overflow-y-auto no-scrollbar">
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">👍</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">❤️</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">🔥</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">🎉</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">👏</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">🚀</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">🤣</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">😍</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">💯</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">🌟</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">🎈</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">🥳</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">💪</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">✨</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">🎁</span>
                        <span class="emoji-item cursor-pointer hover:scale-125 transition text-center">🙌</span>
                    </div>

                    <input type="text" id="danmuText" required placeholder="说点什么吧..." maxlength="50"
                           class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-pink-500 transition">
                </div>

                <p class="text-[11px] text-slate-500 text-center">为便于现场管理，发送时会记录本机网络地址和大致地区。</p>

                <!-- 提交按钮 -->
                <button type="submit" class="w-full py-4 bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 rounded-xl font-bold text-lg shadow-lg hover:shadow-pink-500/30 active:scale-98 transition duration-200 mt-2">
                    立即发送弹幕
                </button>
            </form>
        </div>
    </div>

    <!-- 弹窗2：预设/批量上传弹幕 Modal -->
    <div id="presetModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="relative w-full max-w-xl mx-4 bg-slate-800/95 border border-slate-700/80 rounded-3xl p-6 md:p-8 shadow-2xl text-white transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto no-scrollbar">
            
            <button id="closePresetModal" class="absolute top-5 right-5 text-slate-400 hover:text-white w-9 h-9 rounded-full bg-slate-700/50 flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <h2 class="text-2xl font-bold mb-4 flex items-center space-x-2 text-indigo-400">
                <i class="fa-solid fa-list-check"></i>
                <span>弹幕库预设与批量导入</span>
            </h2>

            <p class="text-xs text-slate-400 mb-4">您可以添加预设弹幕，或点击一键自动循环广播弹幕墙。</p>

            <!-- 批量输入框 -->
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1">批量添加弹幕 (每行一条：姓名,弹幕内容)</label>
                    <textarea id="batchInput" rows="4" placeholder="张伟,祝公司越来越好！&#10;李娜,新年快乐 🎉&#10;王强,项目顺利上线！"
                              class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div class="flex space-x-3">
                    <button id="addBatchBtn" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold text-sm transition">
                        批量添加至预设库
                    </button>
                    <button id="autoPlayBtn" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-semibold text-sm transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-play text-xs"></i>
                        <span id="autoPlayText">开启自动持续推送</span>
                    </button>
                </div>
            </div>

            <!-- 当前预设列表展示 -->
            <div class="mt-6">
                <h3 class="text-sm font-bold text-slate-300 mb-3 flex justify-between items-center">
                    <span>当前预设弹幕列表 (<span id="presetCount">0</span>)</span>
                    <button id="clearPresetsBtn" class="text-xs text-red-400 hover:underline">清空全部</button>
                </h3>
                <div id="presetList" class="space-y-2 max-h-48 overflow-y-auto pr-1 no-scrollbar">
                    <!-- 动态呈现预设项 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 弹窗3：背景图片选择/更换 Modal -->
    <div id="bgModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="relative w-full max-w-lg mx-4 bg-slate-800/95 border border-slate-700/80 rounded-3xl p-6 md:p-8 shadow-2xl text-white transform scale-95 transition-transform duration-300">
            
            <button id="closeBgModal" class="absolute top-5 right-5 text-slate-400 hover:text-white w-9 h-9 rounded-full bg-slate-700/50 flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <h2 class="text-2xl font-bold mb-4 flex items-center space-x-2 text-pink-400">
                <i class="fa-solid fa-palette"></i>
                <span>更换大屏背景</span>
            </h2>

            <!-- 预设壁纸网格 -->
            <div class="grid grid-cols-3 gap-3 mb-5">
                <div class="bg-option cursor-pointer overflow-hidden rounded-xl border-2 border-pink-500 h-20 transition hover:scale-105" data-bg="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1920&auto=format&fit=crop">
                    <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=400" class="w-full h-full object-cover">
                </div>
                <div class="bg-option cursor-pointer overflow-hidden rounded-xl border-2 border-transparent hover:border-pink-500 h-20 transition hover:scale-105" data-bg="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=1920&auto=format&fit=crop">
                    <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=400" class="w-full h-full object-cover">
                </div>
                <div class="bg-option cursor-pointer overflow-hidden rounded-xl border-2 border-transparent hover:border-pink-500 h-20 transition hover:scale-105" data-bg="https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?q=80&w=1920&auto=format&fit=crop">
                    <img src="https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?q=80&w=400" class="w-full h-full object-cover">
                </div>
                <div class="bg-option cursor-pointer overflow-hidden rounded-xl border-2 border-transparent hover:border-pink-500 h-20 transition hover:scale-105" data-bg="https://images.unsplash.com/photo-1508739773434-c26b3d09e071?q=80&w=1920&auto=format&fit=crop">
                    <img src="https://images.unsplash.com/photo-1508739773434-c26b3d09e071?q=80&w=400" class="w-full h-full object-cover">
                </div>
                <div class="bg-option cursor-pointer overflow-hidden rounded-xl border-2 border-transparent hover:border-pink-500 h-20 transition hover:scale-105" data-bg="https://images.unsplash.com/photo-1519750157634-b6d493a0f77c?q=80&w=1920&auto=format&fit=crop">
                    <img src="https://images.unsplash.com/photo-1519750157634-b6d493a0f77c?q=80&w=400" class="w-full h-full object-cover">

            <!-- 自定义背景链接 -->
            <div class="space-y-3">

                    <input type="url" id="bgUrlInput" placeholder="https://..." class="flex-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-pink-500">
                    <button id="applyBgUrlBtn" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 rounded-xl text-sm font-semibold">应用</button>
                </div>
                <div class="flex items-center justify-between pt-2">
                    <label class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-semibold cursor-pointer border border-slate-600 transition flex items-center space-x-2">
                        <i class="fa-solid fa-file-image"></i>
                        <span>从本地设备选择背景</span>
                        <input type="file" id="bgFileInput" accept="image/*" class="hidden">

    <div id="musicModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="relative w-full max-w-md mx-4 bg-slate-800/95 border border-slate-700/80 rounded-3xl p-6 shadow-2xl text-white transform scale-95 transition-transform duration-300">
            <button id="closeMusicModal" type="button" class="absolute top-5 right-5 text-slate-400 hover:text-white w-9 h-9 rounded-full bg-slate-700/50 flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h2 class="text-2xl font-bold mb-2 flex items-center gap-2 text-emerald-300">
                <i class="fa-solid fa-music"></i>
                <span>背景音乐</span>
            </h2>
            <p id="musicStatus" class="text-sm text-slate-300 mb-4">当前没有背景音乐。上传后大屏会循环播放。</p>
            <div class="flex flex-wrap gap-2">
                <label class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-sm font-semibold cursor-pointer">
                    上传音频
                    <input id="musicFileInput" type="file" accept="audio/*,.mp3,.m4a,.aac,.ogg,.wav,.webm" class="hidden">
                </label>
                <button id="musicToggleBtn" type="button" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl text-sm font-semibold border border-white/20">播放</button>
                <button id="musicClearBtn" type="button" class="px-4 py-2 bg-red-500/20 hover:bg-red-500/40 text-red-100 rounded-xl text-sm font-semibold border border-red-500/30">移除</button>
            </div>
            <p class="mt-3 text-xs text-slate-400">支持 mp3、m4a、aac、ogg、wav、webm，最大 20MB。观众页若被浏览器拦住自动播放，会提示点击一次。</p>
        </div>
    </div>

    <!-- 核心逻辑脚本 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- 状态与变量定义 ---
            const danmuContainer = document.getElementById('danmuContainer');
            let currentAvatar = "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix";
            let autoPlayTimer = null;
            let presets = [];
            let ws = null;
            let loopEnabled = true;
            let danmuSpeed = 50;
            let reconnectTimer = null;
            const trackCount = 8;
            const trackReadyAt = new Array(trackCount).fill(0);

            function pickTrack(visibleMs) {
                const now = performance.now();
                let best = 0;
                for (let i = 1; i < trackCount; i++) {
                    if (trackReadyAt[i] < trackReadyAt[best]) best = i;
                }
                trackReadyAt[best] = Math.max(now, trackReadyAt[best]) + visibleMs;
                return best;
            }

            function clampSpeed(value) {
                const n = Math.round(Number(value));
                if (!Number.isFinite(n)) return 50;
                return Math.max(0, Math.min(100, n));
            }

            // 50 = 当前速度（飞行 10–18 秒）。0 约为 1/4 速，100 约为 4 倍速。
            function speedToRate(speed) {
                return Math.pow(4, (clampSpeed(speed) - 50) / 50);
            }

            function applyDanmuSpeed(speed) {
                danmuSpeed = clampSpeed(speed);
                const rate = speedToRate(danmuSpeed);
                document.querySelectorAll('#danmuContainer .bullet-item').forEach((el) => {
                    if (el._flyAnim && el._flyAnim.playState !== 'finished' && el._flyAnim.playState !== 'idle') {
                        el._flyAnim.playbackRate = rate;
                    }
                });
                const slider = document.getElementById('speedSlider');
                const label = document.getElementById('speedValue');
                if (slider && Number(slider.value) !== danmuSpeed) slider.value = String(danmuSpeed);
                if (label) label.textContent = String(danmuSpeed);
            }

            function wsUrl() {
                const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
                return proto + '//' + location.host + BASE + '/ws';
            }

            function sendWs(payload) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify(payload));
                    return true;
                }
                return false;
            }

            let adminToken = '';
            function sendAdmin(payload) {
                return sendWs(Object.assign({}, payload, { token: adminToken }));
            }

            function getClientId() {
                const key = 'danmu_client_id';
                let id = localStorage.getItem(key) || '';
                if (!/^[A-Za-z0-9-]{8,64}$/.test(id)) {
                    const raw = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('c' + Math.random().toString(36).slice(2) + Date.now().toString(36));
                    id = raw.replace(/[^A-Za-z0-9-]/g, '').slice(0, 64);
                    localStorage.setItem(key, id);
                }
                return id;
            }
            const CITY_KEY = 'danmu_city';
            const CITY_NAMES = ['上海', '东莞', '武汉', '成都', '杭州', '北京', '西安', '南京'];
            function getSavedCity() {
                const city = (localStorage.getItem(CITY_KEY) || '').trim();
                return CITY_NAMES.includes(city) ? city : '';
            }
            function saveCity(city) {
                if (!CITY_NAMES.includes(city)) return;
                try { localStorage.setItem(CITY_KEY, city); } catch (_) {}
                refreshMyCityLabel();
            }
            let lastSuggestedCity = '';
            let cityPickManual = false;
            function refreshMyCityLabel() {
                const label = document.getElementById('myCityLabel');
                const btn = document.getElementById('myCityBtn');
                if (!label && !btn) return;
                const city = getSavedCity();
                if (label) label.textContent = city || '选地域';
                if (btn) btn.title = city ? `当前地域：${city}，点击更改` : '选择所在城市';
            }
            refreshMyCityLabel();
            function applyBackground(url) {
                const layer = document.getElementById('bgLayer');
                if (!layer || !url || layer.dataset.applied === url) return;
                layer.dataset.applied = url;
                const full = url.charAt(0) === '/' ? (BASE + url) : url;
                layer.style.backgroundImage = "url('" + full.replace(/'/g, '') + "')";
            }
            let musicState = { url: '', name: '', playing: false };
            let bgmLocalPaused = false;
            function isMobileAudience() {
                const ua = navigator.userAgent || '';
                if (/Android|iPhone|iPad|iPod|Mobile|WeLink|welink|MicroMessenger|HarmonyOS/i.test(ua)) return true;
                try {
                    if (window.matchMedia('(pointer: coarse)').matches) return true;
                } catch (_) {}
                return navigator.maxTouchPoints > 0 && Math.min(screen.width, screen.height) < 900;
            }
            function refreshBgmButton() {
                const hint = document.getElementById('bgmHint');
                const audio = document.getElementById('bgm');
                if (!hint || !audio) return;
                if (!musicState.url) {
                    hint.classList.add('hidden');
                    hint.style.display = 'none';
                    return;
                }
                hint.classList.remove('hidden');
                hint.style.display = '';
                const playing = !audio.paused && !audio.ended;
                hint.textContent = playing ? '点击暂停背景音乐' : '点击播放背景音乐';
            }
            function applyMusic(state) {
                const audio = document.getElementById('bgm');
                const status = document.getElementById('musicStatus');
                const toggle = document.getElementById('musicToggleBtn');
                if (!audio) return;
                const nextUrl = (state && state.url) || '';
                const full = nextUrl ? (nextUrl.charAt(0) === '/' ? BASE + nextUrl : nextUrl) : '';
                if (audio.dataset.src !== full) {
                    audio.dataset.src = full;
                    if (full) audio.src = full;
                    else audio.removeAttribute('src');
                    bgmLocalPaused = false;
                }
                musicState = {
                    url: nextUrl,
                    name: (state && state.name) || '',
                    playing: !!(state && state.playing && nextUrl),
                };
                if (status) {
                    status.textContent = musicState.url
                        ? ('正在使用：' + (musicState.name || '背景音乐') + (musicState.playing ? '（播放中）' : '（已暂停）'))
                        : '当前没有背景音乐。上传后大屏会循环播放。';
                }
                if (toggle) toggle.textContent = musicState.playing ? '暂停' : '播放';
                if (!musicState.url) {
                    audio.pause();
                    refreshBgmButton();
                    return;
                }
                refreshBgmButton();
                if (!musicState.playing || bgmLocalPaused) {
                    audio.pause();
                    refreshBgmButton();
                    return;
                }
                if (isMobileAudience()) {
                    refreshBgmButton();
                    return;
                }
                const pending = audio.play();
                if (pending && pending.then) pending.then(refreshBgmButton).catch(refreshBgmButton);
                else refreshBgmButton();
            }
            const bgmAudio = document.getElementById('bgm');
            if (bgmAudio) {
                bgmAudio.addEventListener('playing', refreshBgmButton);
                bgmAudio.addEventListener('pause', refreshBgmButton);
            }
            const bgmHint = document.getElementById('bgmHint');
            if (bgmHint) {
                bgmHint.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    const audio = document.getElementById('bgm');
                    if (!audio || !musicState.url) return;
                    if (!audio.paused && !audio.ended) {
                        bgmLocalPaused = true;
                        audio.pause();
                        refreshBgmButton();
                        return;
                    }
                    bgmLocalPaused = false;
                    const pending = audio.play();
                    if (pending && pending.then) pending.then(refreshBgmButton).catch(refreshBgmButton);
                    else refreshBgmButton();
                });
            }
            fetch(BASE + '/api/music', { cache: 'no-store' })
                .then((res) => res.json())
                .then((data) => { if (data) applyMusic(data); })
                .catch(() => {});
            fetch(BASE + '/api/background', { cache: 'no-store' })
                .then((res) => res.json())
                .then((data) => { if (data && data.url) applyBackground(data.url); })
                .catch(() => {});
            function recheckinCached() {
                if (/^(\/danmu)?\/admin\/?$/.test(location.pathname)) return;
                const payload = { type: 'identify', client_id: clientId, checkin: true };
                const city = getSavedCity();
                if (city) payload.city = city;
                sendWs(payload);
            }
            const clientId = getClientId();
            const myIds = new Set();
            try {
                const saved = JSON.parse(localStorage.getItem('danmu_my_ids') || '[]');
                if (Array.isArray(saved)) saved.forEach((id) => myIds.add(String(id)));
            } catch (_) {}
            function applyMineStyle(el) {
                el.classList.add('danmu-mine');
                el.style.borderStyle = 'solid';
                el.style.borderWidth = '';
                el.style.borderColor = '';
                el.style.boxShadow = '';
                if (!el.querySelector('.danmu-mine-tag')) {
                    el.insertAdjacentHTML('afterbegin', '<span class="danmu-mine-tag">我</span>');
                }
            }

            function rememberMine(id) {
                if (id === undefined || id === null) return;
                myIds.add(String(id));
                const kept = Array.from(myIds).slice(-200);
                myIds.clear();
                kept.forEach((x) => myIds.add(x));
                localStorage.setItem('danmu_my_ids', JSON.stringify(kept));
                document.querySelectorAll('#danmuContainer .bullet-item').forEach((el) => {
                    if (el.dataset.id === String(id)) applyMineStyle(el);
                });
            }

            function applyLoopUi(enabled) {
                loopEnabled = !!enabled;
                if (!autoPlayBtn || !autoPlayText) return;
                if (loopEnabled) {
                    autoPlayBtn.classList.replace('bg-emerald-600', 'bg-amber-600');
                    autoPlayBtn.classList.replace('hover:bg-emerald-500', 'hover:bg-amber-500');
                    autoPlayText.innerText = '暂停自动推送';
                } else {
                    autoPlayBtn.classList.replace('bg-amber-600', 'bg-emerald-600');
                    autoPlayBtn.classList.replace('hover:bg-amber-500', 'hover:bg-emerald-500');
                    autoPlayText.innerText = '开启自动持续推送';
                }
            }

            function syncPresetsFromServer(items) {
                if (!Array.isArray(items)) return;
                presets = items.map((it) => ({
                    name: it.name,
                    text: it.text,
                    avatar: it.avatar,
                    id: it.id,
                    senderIp: it.sender_ip || '',
                    senderRegion: it.sender_region || ''
                }));
                try { renderPresets(); } catch (_) {}
            }

            function handleServerMessage(msg) {
                if (!msg || !msg.type) return;
                if (msg.type === 'hello') {
                    applyLoopUi(msg.loop !== false);
                    if (msg.speed !== undefined) applyDanmuSpeed(msg.speed);
                    syncPresetsFromServer(msg.items || []);
                    if (msg.cities) renderCityStats(msg.cities, msg.cities_version, true, msg.cities_day);
                    if (msg.background) applyBackground(msg.background);
                    if (msg.music) applyMusic(msg.music);
                    return;
                }
                if (msg.type === 'background') {
                    applyBackground(msg.url);
                    return;
                }
                if (msg.type === 'music') {
                    applyMusic(msg);
                    return;
                }
                if (msg.type === 'city_stats') {
                    renderCityStats(msg.items || [], msg.version, false, msg.day);
                    return;
                }
                if (msg.type === 'checkin_ack') {
                    if (CITY_NAMES.includes(msg.suggested_city)) lastSuggestedCity = msg.suggested_city;
                    if (msg.city) saveCity(msg.city);
                    else refreshMyCityLabel();
                    if (Array.isArray(msg.items)) renderCityStats(msg.items, msg.version, false, msg.day);
                    if (msg.need_city && !getSavedCity()) openCityPickModal(msg.suggested_city || '');
                    else if (!cityPickManual) closeCityPickModal();
                    return;
                }
                if (msg.type === 'visits_cleared') {
                    renderCityStats(msg.items || [], msg.version, true, msg.day);
                    if (isAdmin) alert('已清空今日访问人数。已选城市仍保留，下次进入会按原城市重新计数。');
                    return;
                }
                if (msg.type === 'speed') {
                    applyDanmuSpeed(msg.value);
                    return;
                }
                if (msg.type === 'sent') {
                    rememberMine(msg.id);
                    return;
                }
                if (msg.type === 'error' && msg.error === 'unauthorized' && isAdmin) {
                    alert('管理口令不正确。请用 /admin?token=口令 重新打开一次。');
                    return;
                }
                if (msg.type === 'error' && msg.error === 'rate_limited') {
                    alert('发送太快了，请隔几秒再发');
                    return;
                }
                if (msg.type === 'fire' && msg.danmu) {
                    const d = msg.danmu;
                    createDanmu({
                        id: d.id,
                        name: d.name,
                        text: d.text,
                        avatar: d.avatar,
                        mine: !!msg.mine
                    });
                    return;
                }
                if (msg.type === 'library') {
                    // 广播只带最近 50 条；管理面要能删任意一条，所以另取全量
                    if (isAdmin) sendAdmin({ type: 'list' });
                    else if (msg.items) syncPresetsFromServer(msg.items);
                    return;
                }
                if (msg.type === 'library_full') {
                    syncPresetsFromServer(msg.items || []);
                    return;
                }
                if (msg.type === 'remove') {
                    const ids = (Array.isArray(msg.ids) ? msg.ids : [msg.id])
                        .filter((value) => value !== undefined && value !== null)
                        .map(String);
                    const gone = new Set(ids);
                    presets = presets.filter((p) => !gone.has(String(p.id)));
                    try { renderPresets(); } catch (_) {}
                    danmuContainer.querySelectorAll('.bullet-item').forEach((el) => {
                        if (gone.has(el.dataset.id)) el.remove();
                    });
                    return;
                }
                if (msg.type === 'clear_library') {
                    presets = [];
                    try { renderPresets(); } catch (_) {}
                    clearDanmuWithParticles();
                    return;
                }
                if (msg.type === 'loop') {
                    applyLoopUi(msg.enabled);
                    return;
                }
                if (msg.type === 'clear_screen') {
                    clearDanmuWithParticles();
                }
            }

            function connectSocket() {
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                try {
                    ws = new WebSocket(wsUrl());
                } catch (e) {
                    reconnectTimer = setTimeout(connectSocket, 2000);
                    return;
                }
                ws.onopen = () => {
                    const payload = { type: 'identify', client_id: clientId, checkin: !isAdmin };
                    const city = getSavedCity();
                    if (city) payload.city = city;
                    sendWs(payload);
                    if (isAdmin) sendAdmin({ type: 'list' });
                };
                ws.onmessage = (ev) => {
                    try { handleServerMessage(JSON.parse(ev.data)); } catch (_) {}
                };
                ws.onclose = () => {
                    reconnectTimer = setTimeout(connectSocket, 2000);
                };
                ws.onerror = () => {
                    try { ws.close(); } catch (_) {}
                };
            }

            // --- DOM 元素引用 ---
            const sendModal = document.getElementById('sendModal');
            const openSendModalBtn = document.getElementById('openSendModalBtn');
            const closeSendModal = document.getElementById('closeSendModal');
            const danmuForm = document.getElementById('danmuForm');
            const avatarPreview = document.getElementById('avatarPreview');
            const avatarInput = document.getElementById('avatarInput');
            const presetAvatars = document.querySelectorAll('.preset-avatar');
            const toggleEmojiBtn = document.getElementById('toggleEmojiBtn');
            const emojiPicker = document.getElementById('emojiPicker');
            const danmuTextInput = document.getElementById('danmuText');

            const bgModal = document.getElementById('bgModal');
            const bgBtn = document.getElementById('bgBtn');
            const closeBgModal = document.getElementById('closeBgModal');
            const bgLayer = document.getElementById('bgLayer');
            const bgOptions = document.querySelectorAll('.bg-option');
            const bgUrlInput = document.getElementById('bgUrlInput');
            const applyBgUrlBtn = document.getElementById('applyBgUrlBtn');
            const bgFileInput = document.getElementById('bgFileInput');

            const musicModal = document.getElementById('musicModal');
            const musicBtn = document.getElementById('musicBtn');
            const closeMusicModal = document.getElementById('closeMusicModal');
            const musicFileInput = document.getElementById('musicFileInput');
            const musicToggleBtn = document.getElementById('musicToggleBtn');
            const musicClearBtn = document.getElementById('musicClearBtn');

            const presetModal = document.getElementById('presetModal');
            const presetBtn = document.getElementById('presetBtn');
            const closePresetModal = document.getElementById('closePresetModal');
            const presetList = document.getElementById('presetList');
            const presetCount = document.getElementById('presetCount');
            const batchInput = document.getElementById('batchInput');
            const addBatchBtn = document.getElementById('addBatchBtn');
            const clearPresetsBtn = document.getElementById('clearPresetsBtn');
            const autoPlayBtn = document.getElementById('autoPlayBtn');
            const autoPlayText = document.getElementById('autoPlayText');
            const clearBtn = document.getElementById('clearBtn');
            const clearVisitsBtn = document.getElementById('clearVisitsBtn');
            const speedControl = document.getElementById('speedControl');
            const speedSlider = document.getElementById('speedSlider');
            const cityPickModal = document.getElementById('cityPickModal');
            const cityPickGrid = document.getElementById('cityPickGrid');
            const cityPickHint = document.getElementById('cityPickHint');
            let cityStatsVersion = -1;
            let cityStatsDay = '';
            let cityPickOpen = false;
            function openCityPickModal(suggested) {
                if (isAdmin || !cityPickModal || cityPickOpen) return;
                cityPickOpen = true;
                const suggest = CITY_NAMES.includes(suggested) ? suggested : '';
                const current = getSavedCity();
                if (cityPickHint) {
                    if (current && suggest && suggest !== current) {
                        cityPickHint.textContent = `当前是「${current}」。网络归属地像是「${suggest}」，可改选。`;
                    } else if (current) {
                        cityPickHint.textContent = `当前是「${current}」，点选可更改。`;
                    } else if (suggest) {
                        cityPickHint.textContent = `网络归属地像是「${suggest}」，若与你实际所在地不符请改选。`;
                    } else {
                        cityPickHint.textContent = '用于大屏城市访问统计。运营商归属地可能不准，请按你实际所在城市选择。';
                    }
                }
                cityPickGrid.innerHTML = CITY_NAMES.map((city) => {
                    const isCurrent = city === current;
                    const isSuggest = city === suggest && !isCurrent;
                    const on = isCurrent || (!current && city === suggest);
                    const badge = isCurrent
                        ? '<div class="text-[10px] font-normal text-pink-200 mt-1">当前</div>'
                        : (isSuggest ? '<div class="text-[10px] font-normal text-pink-200 mt-1">IP 建议</div>' : '');
                    return `<button type="button" data-city="${city}" class="city-pick-btn px-3 py-3 rounded-2xl text-sm font-semibold border transition active:scale-95 ${on ? 'bg-pink-500/30 border-pink-300 text-white ring-2 ring-pink-400' : 'bg-white/5 border-white/15 text-slate-100 hover:bg-white/10'}">${city}${badge}</button>`;
                }).join('');
                openModal(cityPickModal);
            }
            function closeCityPickModal() {
                if (!cityPickModal || !cityPickOpen) return;
                cityPickOpen = false;
                cityPickManual = false;
                closeModal(cityPickModal);
            }
            if (cityPickGrid) {
                cityPickGrid.addEventListener('click', (ev) => {
                    const btn = ev.target.closest('[data-city]');
                    if (!btn) return;
                    const city = btn.getAttribute('data-city');
                    if (!CITY_NAMES.includes(city)) return;
                    saveCity(city);
                    closeCityPickModal();
                    if (!sendWs({ type: 'identify', client_id: clientId, checkin: true, city })) {
                        alert('未连上共享服务，城市已保存在本机，连上后会自动上报');
                    }
                });
            }
            function renderCityStats(items, version, force, day) {
                const grid = document.getElementById('cityGrid');
                if (!grid) return;
                if (day && cityStatsDay && day < cityStatsDay) return;
                const dayRolled = !!(day && cityStatsDay && day > cityStatsDay);
                if (dayRolled) force = true;
                if (version !== undefined && version !== null && version !== '') {
                    const next = Number(version);
                    if (Number.isFinite(next)) {
                        if (!force && next < cityStatsVersion) return;
                        cityStatsVersion = next;
                    }
                }
                if (day) cityStatsDay = day;
                const counts = {};
                CITY_NAMES.forEach((city) => { counts[city] = 0; });
                (items || []).forEach((it) => {
                    if (it && Object.prototype.hasOwnProperty.call(counts, it.city)) counts[it.city] = Number(it.count) || 0;
                });
                grid.innerHTML = CITY_NAMES.map((city) => `
                    <div class="flex items-center justify-between gap-1 min-w-0 px-1.5 py-px rounded bg-black/40 border border-white/10 leading-none">
                        <span class="text-[10px] font-medium text-pink-100 truncate">${city}</span>
                        <span class="text-[10px] font-bold tabular-nums text-white">${counts[city]}</span>
                    </div>
                `).join('');
                fitDanmuTop();
                if (dayRolled) recheckinCached();
            }
            function fitDanmuTop() {
                const chrome = document.getElementById('topChrome');
                if (!chrome) return;
                danmuContainer.style.paddingTop = (chrome.offsetHeight + 8) + 'px';
            }
            const isAdmin = /^(\/danmu)?\/admin\/?$/.test(window.location.pathname);
            if (isAdmin) {
                const params = new URLSearchParams(location.search);
                const fromUrl = params.get('token');
                if (fromUrl) {
                    localStorage.setItem('danmu_admin_token', fromUrl);
                    params.delete('token');
                    const qs = params.toString();
                    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
                }
                adminToken = localStorage.getItem('danmu_admin_token') || '';
            }

            if (isAdmin) {
                const cityBoard = document.getElementById('cityBoard');
                if (cityBoard) cityBoard.remove();
                const myCityBtn = document.getElementById('myCityBtn');
                if (myCityBtn) myCityBtn.remove();
                bgBtn.classList.remove('hidden');
                musicBtn.classList.remove('hidden');
                presetBtn.classList.remove('hidden');
                speedControl.classList.remove('hidden');
                clearVisitsBtn.classList.remove('hidden');
                clearVisitsBtn.classList.add('inline-flex', 'items-center');
                bgBtn.classList.add('flex');
                musicBtn.classList.add('flex');
                presetBtn.classList.add('flex');
                speedControl.classList.add('flex');
                speedSlider.addEventListener('input', () => {
                    const value = clampSpeed(speedSlider.value);
                    applyDanmuSpeed(value);
                    if (!sendAdmin({ type: 'speed', value })) {
                        applyDanmuSpeed(value);
                    }
                });
            } else {
                bgBtn.remove();
                musicBtn.remove();
                presetBtn.remove();
                speedControl.remove();
                clearVisitsBtn.remove();
                const myCityBtn = document.getElementById('myCityBtn');
                refreshMyCityLabel();
                if (myCityBtn) {
                    myCityBtn.addEventListener('click', () => {
                        cityPickManual = true;
                        openCityPickModal(lastSuggestedCity);
                    });
                }
            }

            // --- 弹窗管理函数 ---
            function openModal(modal) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                const content = modal.firstElementChild;
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }

            function closeModal(modal) {
                modal.classList.add('opacity-0', 'pointer-events-none');
                const content = modal.firstElementChild;
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
            }

            // --- 弹窗触发绑定 ---
            openSendModalBtn.addEventListener('click', () => openModal(sendModal));
            closeSendModal.addEventListener('click', () => closeModal(sendModal));

            if (isAdmin) {
                bgBtn.addEventListener('click', () => openModal(bgModal));
                closeBgModal.addEventListener('click', () => closeModal(bgModal));

                musicBtn.addEventListener('click', () => openModal(musicModal));
                closeMusicModal.addEventListener('click', () => closeModal(musicModal));

                presetBtn.addEventListener('click', () => {
                    renderPresets();
                    openModal(presetModal);
                });
                closePresetModal.addEventListener('click', () => closeModal(presetModal));
            }

            // 点击背景弹窗外部关闭
            [sendModal, bgModal, presetModal, musicModal].forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal(modal);
                });
            });

            // --- 头像切换与上传逻辑 ---
            presetAvatars.forEach(img => {
                img.addEventListener('click', () => {
                    presetAvatars.forEach(i => i.classList.replace('border-pink-500', 'border-transparent'));
                    img.classList.replace('border-transparent', 'border-pink-500');
                    currentAvatar = img.src;
                    avatarPreview.src = currentAvatar;
                });
            });

            avatarInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        currentAvatar = evt.target.result;
                        avatarPreview.src = currentAvatar;
                    };
                    reader.readAsDataURL(file);
                }
            });

            // --- Emoji 选择器 ---
            toggleEmojiBtn.addEventListener('click', () => {
                emojiPicker.classList.toggle('hidden');
            });

            document.querySelectorAll('.emoji-item').forEach(emoji => {
                emoji.addEventListener('click', () => {
                    danmuTextInput.value += emoji.innerText;
                    danmuTextInput.focus();
                });
            });

            // --- 核心：发送弹幕逻辑 ---
            function createDanmu({ id, name, text, avatar, mine = false }) {
                const danmu = document.createElement('div');
                const isMine = !!mine || (id !== undefined && id !== null && myIds.has(String(id)));
                danmu.className = 'bullet-item flex items-center space-x-3 px-4 py-2 rounded-full border shadow-xl backdrop-blur-md bg-black/70 border-pink-500/50' + (isMine ? ' danmu-mine' : '');
                if (id !== undefined && id !== null) danmu.dataset.id = String(id);
                
                // 基准飞行时间 10s~18s，对应速度 50；实际快慢由 playbackRate 缩放
                const durationMs = (10 + Math.random() * 8) * 1000;
                const visibleMs = durationMs / speedToRate(danmuSpeed);
                const trackIndex = pickTrack(visibleMs);
                const topPercent = 10 + (trackIndex * 9);
                danmu.style.top = `${topPercent}%`;

                // 弹幕 HTML 结构
                danmu.innerHTML = `
                    ${isMine ? '<span class="danmu-mine-tag">我</span>' : ''}
                    <img src="${avatar}" class="w-8 h-8 rounded-full object-cover border border-white/50 flex-shrink-0" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=default'">
                    <span class="text-xs font-bold text-pink-300 opacity-90 flex-shrink-0">${escapeHtml(name)}:</span>
                    <span class="text-sm md:text-base font-semibold tracking-wide text-white">${escapeHtml(text)}</span>
                `;

                // 鼠标悬停暂停动画
                danmu.addEventListener('mouseenter', () => {
                    if (danmu._flyAnim && danmu._flyAnim.playState === 'running') danmu._flyAnim.pause();
                    danmu.style.zIndex = '40';
                });
                danmu.addEventListener('mouseleave', () => {
                    if (danmu._flyAnim && danmu._flyAnim.playState === 'paused') danmu._flyAnim.play();
                    danmu.style.zIndex = 'auto';
                });

                if (isMine) applyMineStyle(danmu);
                danmuContainer.appendChild(danmu);

                const flyAnim = danmu.animate(
                    [{ transform: 'translateX(100vw)' }, { transform: 'translateX(-100%)' }],
                    { duration: durationMs, easing: 'linear', fill: 'forwards' }
                );
                flyAnim.playbackRate = speedToRate(danmuSpeed);
                danmu._flyAnim = flyAnim;
                flyAnim.onfinish = () => danmu.remove();
            }

            // 安全 HTML 转义
                        let clearingDanmu = false;
            function clearDanmuWithParticles() {
                trackReadyAt.fill(0);
                const items = Array.from(danmuContainer.querySelectorAll('.bullet-item:not(.danmu-dissipating)'));
                if (!items.length) {
                    // 清理残留粒子
                    document.querySelectorAll('.danmu-particle').forEach((p) => p.remove());
                    return;
                }
                clearingDanmu = true;
                const palette = ['#ff7eb9', '#ff65a3', '#7afcff', '#feff9c', '#ffd6a5', '#ffffff', '#c4b5fd'];

                items.forEach((el) => {
                    const rect = el.getBoundingClientRect();
                    // 先定格在当前视觉位置，再取消飞行动画，避免弹回左侧
                    if (el._flyAnim) el._flyAnim.cancel();
                    el.style.animation = 'none';
                    el.style.position = 'fixed';
                    el.style.left = rect.left + 'px';
                    el.style.top = rect.top + 'px';
                    el.style.right = 'auto';
                    el.style.bottom = 'auto';
                    el.style.margin = '0';
                    el.style.transform = 'none';
                    el.style.zIndex = '65';
                    el.classList.add('danmu-dissipating');

                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    const count = 36 + Math.floor(Math.random() * 24);
                    for (let i = 0; i < count; i++) {
                        const p = document.createElement('span');
                        p.className = 'danmu-particle';
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 50 + Math.random() * 200;
                        const dx = Math.cos(angle) * dist;
                        const dy = Math.sin(angle) * dist - (20 + Math.random() * 40);
                        const color = palette[i % palette.length];
                        p.style.left = cx + 'px';
                        p.style.top = cy + 'px';
                        p.style.background = color;
                        p.style.color = color;
                        p.style.setProperty('--dx', dx.toFixed(1) + 'px');
                        p.style.setProperty('--dy', dy.toFixed(1) + 'px');
                        p.style.animationDelay = (Math.random() * 0.35).toFixed(3) + 's';
                        const size = 4 + Math.random() * 6;
                        p.style.width = size + 'px';
                        p.style.height = size + 'px';
                        document.body.appendChild(p);
                        p.addEventListener('animationend', () => p.remove(), { once: true });
                    }

                    setTimeout(() => {
                        if (el.parentNode) el.remove();
                    }, 1200);
                });

                setTimeout(() => {
                    clearingDanmu = false;
                }, 2100);
            }

            function escapeHtml(str) {
                return str.replace(/[&<>"']/g, (m) => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
                })[m]);
            }

            // 提交发射弹幕表单
            danmuForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('userName').value.trim();
                const text = danmuTextInput.value.trim();

                if (!name || !text) return;

                const ok = sendWs({
                    type: 'send',
                    danmu: { name, text, avatar: currentAvatar, client_id: clientId }
                });
                if (!ok) {
                    alert('未连上共享服务，请稍后重试');
                    return;
                }

                danmuTextInput.value = '';
                closeModal(sendModal);
            });

            // --- 背景更换逻辑：写入服务器，刷新后仍是这张图 ---
            async function saveBackgroundUrl(url) {
                const res = await fetch(BASE + '/api/background', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-token': adminToken,
                    },
                    body: JSON.stringify({ url }),
                });
                if (!res.ok) throw new Error('save failed');
                const data = await res.json();
                applyBackground(data.url || url);
                closeModal(bgModal);
            }
            bgOptions.forEach(opt => {
                opt.addEventListener('click', async () => {
                    const bgUrl = opt.dataset.bg;
                    if (!bgUrl) return;
                    try {
                        await saveBackgroundUrl(bgUrl);
                        bgOptions.forEach(o => o.classList.replace('border-pink-500', 'border-transparent'));
                        opt.classList.replace('border-transparent', 'border-pink-500');
                    } catch (_) {
                        alert('背景没有保存成功，请确认已用管理口令打开本页');
                    }
                });
            });

            applyBgUrlBtn.addEventListener('click', async () => {
                const url = bgUrlInput.value.trim();
                if (!url) return;
                try {
                    await saveBackgroundUrl(url);
                } catch (_) {
                    alert('背景没有保存成功，请确认已用管理口令打开本页');
                }
            });

            bgFileInput.addEventListener('change', async (e) => {
                const file = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!file) return;
                const body = new FormData();
                body.append('file', file);
                try {
                    const res = await fetch(BASE + '/api/background/upload', {
                        method: 'POST',
                        headers: { 'x-admin-token': adminToken },
                        body,
                    });
                    if (!res.ok) throw new Error('upload failed');
                    const data = await res.json();
                    applyBackground(data.url);
                    closeModal(bgModal);
                } catch (_) {
                    alert('背景上传失败。请确认已用管理口令打开本页，且图片小于 20MB');
                }
            });

            // --- 背景音乐：上传 / 播放暂停 / 移除（仅管理页绑定入口） ---
            async function musicFailText(res) {
                let detail = '';
                try {
                    const data = await res.json();
                    if (data && typeof data.detail === 'string') detail = data.detail;
                } catch (_) {}
                if (res.status === 401 || res.status === 403 || detail === 'forbidden') {
                    return '请确认已用管理口令打开本页';
                }
                if (detail) return detail;
                return '操作失败。支持 mp3、m4a、aac、ogg、wav、webm，小于 20MB';
            }
            if (isAdmin) {
                musicFileInput.addEventListener('change', async (e) => {
                    const file = e.target.files && e.target.files[0];
                    e.target.value = '';
                    if (!file) return;
                    const body = new FormData();
                    body.append('file', file);
                    try {
                        const res = await fetch(BASE + '/api/music/upload', {
                            method: 'POST',
                            headers: { 'x-admin-token': adminToken },
                            body,
                        });
                        if (!res.ok) {
                            alert(await musicFailText(res));
                            return;
                        }
                        applyMusic(await res.json());
                    } catch (_) {
                        alert('上传失败。支持 mp3、m4a、aac、ogg、wav、webm，小于 20MB。请确认已用管理口令打开本页');
                    }
                });
                musicToggleBtn.addEventListener('click', async () => {
                    if (!musicState.url) {
                        const status = document.getElementById('musicStatus');
                        if (status) status.textContent = '请先上传背景音乐';
                        return;
                    }
                    try {
                        const res = await fetch(BASE + '/api/music', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-admin-token': adminToken,
                            },
                            body: JSON.stringify({ playing: !musicState.playing }),
                        });
                        if (!res.ok) {
                            alert(await musicFailText(res));
                            return;
                        }
                        applyMusic(await res.json());
                    } catch (_) {
                        alert('请确认已用管理口令打开本页');
                    }
                });
                musicClearBtn.addEventListener('click', async () => {
                    try {
                        const res = await fetch(BASE + '/api/music', {
                            method: 'DELETE',
                            headers: { 'x-admin-token': adminToken },
                        });
                        if (!res.ok) {
                            alert(await musicFailText(res));
                            return;
                        }
                        applyMusic(await res.json());
                    } catch (_) {
                        alert('请确认已用管理口令打开本页');
                    }
                });
            }

            // --- 预设弹幕 & 批量处理 ---
            function renderPresets() {
                presetCount.innerText = presets.length;
                presetList.innerHTML = '';

                presets.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'flex items-center justify-between p-2 bg-slate-900/80 border border-slate-700/60 rounded-lg text-sm';
                    div.innerHTML = `
                        <div class="flex items-center space-x-2 truncate">
                            <span class="font-bold text-pink-400">${escapeHtml(item.name)}:</span>
                            <span class="text-slate-200 truncate">${escapeHtml(item.text)}</span>
                            ${item.senderRegion ? `<span class="text-[10px] text-amber-200/90">${escapeHtml(item.senderRegion)}</span>` : ''}
                            ${item.senderIp ? `<span class="text-[10px] text-slate-500">${escapeHtml(item.senderIp)}</span>` : ''}
                        </div>
                        <div class="flex items-center space-x-2 flex-shrink-0">
                            <button class="send-preset-btn text-xs px-2 py-1 bg-pink-600/80 hover:bg-pink-500 rounded text-white" data-index="${index}">发射</button>
                            <button class="del-preset-btn text-xs text-slate-500 hover:text-red-400" data-index="${index}" title="从服务器删除"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    presetList.appendChild(div);
                });

                // 绑定单条发射按钮
                document.querySelectorAll('.send-preset-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const idx = e.currentTarget.dataset.index;
                        const item = presets[idx];
                        if (!item) return;
                        if (!sendWs({ type: 'replay', danmu: item })) {
                            alert('未连上共享服务，请稍后重试');
                        }
                    });
                });

                // 绑定删除按钮
                document.querySelectorAll('.del-preset-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const item = presets[e.currentTarget.dataset.index];
                        if (!item || item.id === undefined || item.id === null) return;
                        if (!sendAdmin({ type: 'delete', id: item.id })) {
                            alert('未连上共享服务，请稍后重试');
                        }
                    });
                });
            }

            // 批量输入处理（写入服务端共享库并优先发射）
            addBatchBtn.addEventListener('click', () => {
                const val = batchInput.value.trim();
                if (!val) return;

                const items = [];
                const lines = val.split('\n');
                lines.forEach((line) => {
                    const parts = line.split(',');
                    if (parts.length >= 2) {
                        const name = parts[0].trim();
                        const text = parts.slice(1).join(',').trim();
                        if (!name || !text) return;
                        const randomSeed = Math.random().toString(36).substring(7);
                        items.push({
                            name,
                            text,
                            avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${randomSeed}`
                        });
                    }
                });
                if (!items.length) {
                    alert('格式：每行 昵称,弹幕内容');
                    return;
                }
                if (!sendAdmin({ type: 'batch', items })) {
                    alert('未连上共享服务，请稍后重试');
                    return;
                }
                batchInput.value = '';
            });

            clearPresetsBtn.addEventListener('click', () => {
                if (!presets.length) return;
                if (!confirm(`确定从服务器删除全部 ${presets.length} 条弹幕？此操作不可恢复。`)) return;
                if (!sendAdmin({ type: 'clear_library' })) {
                    alert('未连上共享服务，请稍后重试');
                }
            });

            // 清屏：管理面=全局广播；用户面=仅清本机画面
            if (isAdmin) {
                clearBtn.title = '全局清屏（所有观众）';
                clearBtn.setAttribute('aria-label', '全局清屏');
                clearVisitsBtn.addEventListener('click', () => {
                    if (!confirm('确定清空今日访问统计？城市榜会立刻归零；中国零点的自动日切不受影响。')) return;
                    if (!sendAdmin({ type: 'clear_visits' })) {
                        alert('未连上共享服务，请稍后重试');
                    }
                });
            } else {
                clearBtn.title = '清屏（仅本机）';
                clearBtn.setAttribute('aria-label', '清屏仅本机');
            }
            clearBtn.addEventListener('click', () => {
                if (isAdmin) {
                    if (!sendAdmin({ type: 'clear_screen' })) {
                        clearDanmuWithParticles();
                        alert('未连上共享服务，已仅清本机画面');
                    }
                    // 已连接时由广播 clear_screen 触发粒子消散（含本机）
                } else {
                    clearDanmuWithParticles();
                }
            });

            // 自动循环：由服务端调度，默认开启；按钮切换服务端 loop
            autoPlayBtn.addEventListener('click', () => {
                const next = !loopEnabled;
                if (next && presets.length === 0) {
                    alert('共享库为空，请先添加弹幕！');
                    return;
                }
                if (!sendAdmin({ type: 'loop', enabled: next })) {
                    alert('未连上共享服务，请稍后重试');
                }
            });

            if (!isAdmin) {
                fetch('/api/cities', { cache: 'no-store' })
                    .then((res) => res.json())
                    .then((data) => {
                        if (data && Array.isArray(data.items)) renderCityStats(data.items, data.version, false, data.day);
                    })
                    .catch(() => {});
            }
            fitDanmuTop();
            window.addEventListener('resize', fitDanmuTop);
            // 连接共享服务（服务端按固定间隔出队；新弹幕走热队列加权）
            connectSocket();
        });
    </script>
</body>
</html>
